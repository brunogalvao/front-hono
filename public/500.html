<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#9340db" />
    <title>Serviço indisponível — Task's Finance</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #111116;
        color: #fafafa;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(36rem, calc(100% - 2rem));
        text-align: center;
      }
      .code {
        color: #c4a7ff;
        font-weight: 700;
      }
      h1 {
        margin: 0.5rem 0 1rem;
        font-size: clamp(2rem, 8vw, 3rem);
        letter-spacing: -0.025em;
      }
      p {
        color: #b7b7c2;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        margin-top: 1rem;
        padding: 0 1.5rem;
        align-items: center;
        border-radius: 999px;
        background: #7c3aed;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #c4a7ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="code">500</span>
      <h1>Serviço temporariamente indisponível</h1>
      <p>
        Tente novamente em alguns instantes. Se precisar de suporte, informe o
        código <strong>::vercel:ERROR_CODE::</strong> e a solicitação
        <strong>::vercel:REQUEST_ID::</strong>.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
